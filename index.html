<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Капитал Павла</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: sticky top bar with net worth, tab strip, one working panel per tab; ledger-style tables */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F6F8FA; --line:#DCE2E8;
  --ink:#16222E; --muted:#5E6B78; --faint:#8D99A5;
  --accent:#1D5C8F; --accent-soft:#E2ECF5; --brass:#B07A1E;
  --up:#1E8A52; --up-soft:#E3F3EA; --down:#C23B32; --down-soft:#F8E6E4; --warn:#A86A0B; --warn-soft:#FBF0DC;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#17202A; --surface2:#1D2833; --line:#2A3744;
  --ink:#E6ECF1; --muted:#9AA8B5; --faint:#6F7E8C;
  --accent:#6FA8DA; --accent-soft:#1E3346; --brass:#D9A24A;
  --up:#4FC184; --up-soft:#173024; --down:#EE7166; --down-soft:#3A1E1C; --warn:#E3A84A; --warn-soft:#3A2C14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#17202A; --surface2:#1D2833; --line:#2A3744;
  --ink:#E6ECF1; --muted:#9AA8B5; --faint:#6F7E8C;
  --accent:#6FA8DA; --accent-soft:#1E3346; --brass:#D9A24A;
  --up:#4FC184; --up-soft:#173024; --down:#EE7166; --down-soft:#3A1E1C; --warn:#E3A84A; --warn-soft:#3A2C14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin-right:auto}
.brand span{color:var(--accent)}
.hstat{display:flex;flex-direction:column;align-items:flex-end}
.hstat small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.hstat b{font-size:18px;font-weight:600}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav button{border:0;background:transparent;color:var(--muted);font:500 14px var(--body);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 48px;display:grid;gap:18px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:15px;font-weight:600;margin:0 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel h2 .sub{font-weight:400;font-size:13px;color:var(--muted)}
.kpi small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.kpi .v{font-family:var(--display);font-weight:500;font-size:24px;letter-spacing:-.02em}
.kpi .n{font-size:13px;color:var(--muted);margin-top:4px}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.goal{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.goal .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.goal .name{font-weight:600}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.brass{background:var(--brass)}
.scen{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
input[type=number]{text-align:right}
.scen input{width:130px}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;white-space:nowrap}
td input,td select{width:100%;padding:5px 7px;background:transparent;border-color:transparent}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{background:var(--surface2);border-color:var(--accent)}
tfoot td{font-weight:600;border-bottom:0;padding-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--body);padding:7px 12px;border-radius:7px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--faint);padding:4px 8px}
.btn.ghost:hover{color:var(--down)}
.btn.ghost.armed{color:var(--down);background:var(--down-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.hold{background:var(--accent-soft);color:var(--accent)}
.pill.sell{background:var(--down-soft);color:var(--down)}
.pill.buy{background:var(--up-soft);color:var(--up)}
.pill.watch{background:var(--warn-soft);color:var(--warn)}
td.v-cell select{font-weight:500}
.alloc{display:grid;gap:8px}
.alloc .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px}
.alloc .bar{grid-column:1/-1;height:6px}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{font-size:12px;color:var(--faint);margin-top:10px;max-width:70ch}
.addform{display:flex;gap:8px;flex-wrap:wrap;align-items:end;padding-top:12px;margin-top:12px;border-top:1px dashed var(--line)}
.addform input,.addform select{width:auto}
.empty{padding:24px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;font:500 13px var(--body);color:var(--muted);padding:4px 12px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Капитал <span>→ 40 млн</span></div>
      <div class="hstat"><small>Чистый капитал</small><b id="h-nw">—</b></div>
      <div class="hstat"><small>Ликвидно</small><b id="h-liq">—</b></div>
      <div class="hstat"><small>Пассив / мес</small><b id="h-pass">—</b></div>
    </div>
    <nav role="tablist" id="tabs">
      <button role="tab" data-tab="overview" aria-selected="true">Обзор и цель</button>
      <button role="tab" data-tab="accounts" aria-selected="false">Счета и имущество</button>
      <button role="tab" data-tab="positions" aria-selected="false">Бумаги</button>
      <button role="tab" data-tab="payouts" aria-selected="false">Выплаты</button>
      <button role="tab" data-tab="budget" aria-selected="false">Бюджет</button>
    </nav>
  </div>
</header>

<div class="wrap"><main id="main"></main></div>

<script>
(function(){
"use strict";
const KIND_LABEL={broker:"Брокерский",iis:"ИИС",cash:"Деньги / вклад",property:"Недвижимость",car:"Автомобиль",debt:"Долг / ипотека",foreign:"Зарубежный счёт"};
const LIQUID=["broker","iis","cash","foreign"];
const VERDICT={hold:"Держать",buy:"Докупать",sell:"Продать",watch:"Решить"};
const PKIND={share:"Акция",bond:"Облигация",fund:"Фонд / ЗПИФ",other:"Другое"};
const PAYKIND={coupon:"Купон",dividend:"Дивиденд",rent:"Аренда / ЗПИФ",other:"Другое"};
const MONTHS=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];

// Example state shown only until the store answers / when the store is unavailable.
const LADDER=[5e6,8e6,12e6,16e6,20e6,30e6,40e6];
const state={settings:{contribution:200000,rate:17,base:"liquid"},accounts:[],positions:[],payouts:[],months:[],loaded:false};
let db=null, tab="overview", payYear=new Date().getFullYear(), pendingRender=false, persistOK=false;

// ---------- formatting ----------
const nf=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0});
const rub=n=>(n<0?"−":"")+nf.format(Math.abs(Math.round(n||0)))+" ₽";
const mln=n=>{const a=Math.abs(n||0);return (n<0?"−":"")+(a>=1e6?(a/1e6).toLocaleString("ru-RU",{maximumFractionDigits:a>=1e7?1:2})+" млн ₽":nf.format(Math.round(a))+" ₽")};
const k=n=>{const a=Math.abs(n||0);return a>=1000?(a/1000).toLocaleString("ru-RU",{maximumFractionDigits:a>=1e4?0:1})+"к":nf.format(Math.round(a))};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const x=parseFloat(String(v).replace(/\s/g,"").replace(",","."));return isFinite(x)?x:0};

// ---------- derived ----------
function totals(){
  let assets=0,debts=0,liquid=0,car=0;
  for(const a of state.accounts){
    const v=num(a.value)+num(a.cash);
    if(a.kind==="debt"){debts+=Math.abs(num(a.value));continue}
    assets+=v; if(LIQUID.includes(a.kind)) liquid+=v; if(a.kind==="car") car+=v;
  }
  const nw=assets-debts;
  const now=new Date(), from=new Date(now.getFullYear(),now.getMonth()-11,1);
  const last12=state.payouts.filter(p=>{const d=new Date(p.month+"-01");return d>=from}).reduce((s,p)=>s+num(p.amount),0);
  const goalBase=state.settings.base==="all"?nw-car:liquid;
  return {assets,debts,liquid,car,nw,goalBase,passive:last12/12};
}
function project(start,liquid,monthly,ratePct,targets){
  // liquid part compounds monthly, rest (property equity) stays flat; contributions go to liquid
  const r=ratePct/100/12, fixed=start-liquid; let L=liquid; const pts=[{m:0,v:start}]; const hit={};
  for(let m=1;m<=12*20;m++){L=L*(1+r)+monthly; const v=fixed+L; if(m%3===0) pts.push({m,v});
    for(const t of targets) if(hit[t]==null && v>=t) hit[t]=m;
    if(targets.every(t=>hit[t]!=null) && m>=36 && m%12===0 && v>Math.max(...targets)*1.08) break;}
  return {pts,hit};
}
const monthsLabel=m=>{if(m==null)return "дальше 20 лет";const d=new Date();d.setMonth(d.getMonth()+m);const y=Math.floor(m/12),mm=m%12;
  return d.toLocaleDateString("ru-RU",{month:"short",year:"numeric"})+" · "+(y?y+" г. ":"")+(mm?mm+" мес":"")};

// ---------- storage ----------
const LS="kapital-local-v1";
function saveLocal(){if(persistOK)return;try{localStorage.setItem(LS,JSON.stringify({settings:state.settings,accounts:state.accounts,positions:state.positions,payouts:state.payouts,months:state.months}))}catch(e){}}
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(s){Object.assign(state,s);return true}}catch(e){}return false}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const timers={};
function patch(coll,id,fields){
  const list=state[coll]; const it=list.find(x=>x.id===id); if(!it) return; Object.assign(it,fields);
  if(db){clearTimeout(timers[coll+id]);timers[coll+id]=setTimeout(()=>{delete timers[coll+id];const {id:_,...body}=it;db.collection(coll).doc(id).set(body).catch(err)},350)}
  else saveLocal();
  renderHeader(); if(!isEditing()) render();
}
function add(coll,body){
  const id=uid(); state[coll].push({id,...body});
  if(db) db.collection(coll).doc(id).set(body).catch(err); else saveLocal();
  render();
}
function remove(coll,id){
  state[coll]=state[coll].filter(x=>x.id!==id);
  if(db) db.collection(coll).doc(id).delete().catch(err); else saveLocal();
  render();
}
function saveSettings(f){Object.assign(state.settings,f);
  if(db){clearTimeout(timers.s);timers.s=setTimeout(()=>db.doc("settings/main").set(state.settings).catch(err),400)} else saveLocal();
  renderHeader(); renderOverviewLive();}
function err(e){const m=document.getElementById("banner");if(m){m.hidden=false;m.textContent=e&&e.code==="quota_exceeded"?"Хранилище заполнено: удалите старые выплаты или месяцы.":"Не удалось сохранить изменение. Проверьте подключение и повторите."}}

// ---------- rendering ----------
const main=document.getElementById("main");
function isEditing(){const a=document.activeElement;return a&&main.contains(a)&&(a.tagName==="INPUT"||a.tagName==="SELECT")}
main.addEventListener("focusout",()=>setTimeout(()=>{if(pendingRender&&!isEditing()){pendingRender=false;render()}},0));
function schedule(){if(isEditing()){pendingRender=true;renderHeader()}else render()}

function renderHeader(){const t=totals();
  document.getElementById("h-nw").textContent=mln(t.nw);
  document.getElementById("h-liq").textContent=mln(t.liquid);
  document.getElementById("h-pass").textContent=rub(t.passive);}

function render(){
  renderHeader();
  const banner=`<div class="banner" id="banner" hidden></div>`+(persistOK||!state.loaded?"":`<div class="banner" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <span style="margin-right:auto">Данные хранятся только в этом браузере. Сохраняйте копию через «Экспорт», переносите на другое устройство через «Импорт».</span>
    <button class="btn" id="exp">Экспорт</button><label class="btn" for="imp">Импорт</label><input type="file" id="imp" accept=".json,application/json" hidden></div>`);
  if(!state.loaded){main.innerHTML=banner+`<div class="panel empty">Загружаю ваши счета…</div>`;return}
  const views={overview,accounts,positions,payouts,budget};
  main.innerHTML=banner+views[tab]();
  bind();
  if(tab==="overview") renderOverviewLive();
}

// ----- Overview -----
function overview(){
  const t=totals(), s=state.settings;
  const lastMonths=[...state.months].sort((a,b)=>a.id<b.id?1:-1).slice(0,6);
  const avgSave=lastMonths.length?lastMonths.reduce((x,m)=>x+num(m.income)-num(m.expense),0)/lastMonths.length:null;
  const avgInc=lastMonths.length?lastMonths.reduce((x,m)=>x+num(m.income),0)/lastMonths.length:0;
  const sellCnt=state.positions.filter(p=>p.verdict==="sell"), sellSum=sellCnt.reduce((x,p)=>x+num(p.value),0);
  const pl=state.positions.reduce((x,p)=>x+num(p.value)-num(p.cost),0);
  const byAcc=state.accounts.filter(a=>a.kind!=="debt").map(a=>({n:a.name,k:a.kind,v:num(a.value)+num(a.cash)})).sort((a,b)=>b.v-a.v);
  const maxA=Math.max(1,...byAcc.map(a=>a.v));
  return `
  <section class="grid kpis">
    <div class="panel kpi"><small>Чистый капитал</small><div class="v">${mln(t.nw)}</div><div class="n">активы ${mln(t.assets)} · долги ${mln(t.debts)}</div></div>
    <div class="panel kpi"><small>Ликвидный портфель</small><div class="v">${mln(t.liquid)}</div><div class="n">брокеры, ИИС, деньги</div></div>
    <div class="panel kpi"><small>Пассивный доход</small><div class="v">${rub(t.passive)}</div><div class="n">в среднем за 12 мес по выплатам</div></div>
    <div class="panel kpi"><small>Норма сбережений</small><div class="v">${avgSave==null?"—":Math.round(avgSave/Math.max(1,avgInc)*100)+"%"}</div><div class="n">${avgSave==null?"заполните «Бюджет»":"откладываю ~"+rub(avgSave)+" / мес"}</div></div>
  </section>
  <section class="grid two">
    <div class="panel">
      <h2>Путь к 40 млн <span class="sub">считаю от: ${s.base==="all"?"всего капитала без машины":"ликвидного портфеля"} — ${mln(t.goalBase)}</span></h2>
      <div class="scen">
        <label class="f">Пополнение в месяц, ₽<input id="s-contrib" type="number" step="10000" value="${s.contribution}"></label>
        <label class="f">Доходность, % годовых<input id="s-rate" type="number" step="0.5" value="${s.rate}"></label>
        <div class="f" style="display:grid;gap:4px;font-size:12px;color:var(--muted)">Считать от<span class="seg" role="group" aria-label="База цели"><button data-base="liquid" aria-pressed="${s.base!=="all"}">Портфель</button><button data-base="all" aria-pressed="${s.base==="all"}">Весь капитал</button></span></div>
        ${avgSave!=null?`<button class="btn" id="s-usebudget">Взять из бюджета: ${k(avgSave)}</button>`:""}
      </div>
      <div id="goals"></div>
      <div id="proj"></div>
      <p class="note">Полоска каждого этапа показывает путь от предыдущего этапа. Прогноз: портфель растёт по сложному проценту с ежемесячным пополнением; в режиме «Весь капитал» квартира учитывается по текущей оценке без роста. Это ориентир, а не обещание доходности.</p>
    </div>
    <div class="grid" style="align-content:start">
      <div class="panel">
        <h2>Где лежат деньги</h2>
        ${byAcc.length?`<div class="alloc">${byAcc.map(a=>`<div class="row"><span>${esc(a.n)} <span class="muted">· ${KIND_LABEL[a.k]||""}</span></span><b>${mln(a.v)}</b><div class="bar"><i style="width:${(a.v/maxA*100).toFixed(1)}%" class="${LIQUID.includes(a.k)?"":"brass"}"></i></div></div>`).join("")}</div>`:`<div class="empty">Добавьте счета во вкладке «Счета и имущество»</div>`}
        <div class="legend"><span><i style="background:var(--accent)"></i>ликвидное</span><span><i style="background:var(--brass)"></i>имущество</span></div>
      </div>
      <div class="panel">
        <h2>Бумаги</h2>
        <div class="alloc">
          <div class="row"><span>Позиций в учёте</span><b>${state.positions.length}</b></div>
          <div class="row"><span>Результат по открытым</span><b class="${pl>=0?"up":"down"}">${pl>=0?"+":""}${rub(pl)}</b></div>
          <div class="row"><span>К продаже (налоговая чистка)</span><b class="down">${sellCnt.length} · ${rub(sellSum)}</b></div>
        </div>
      </div>
    </div>
  </section>`;
}
function renderOverviewLive(){
  const g=document.getElementById("goals"); if(!g) return;
  const t=totals(), s=state.settings;
  const goals=LADDER.map(v=>({n:(v/1e6)+" млн",v}));
  const pr=project(t.goalBase,t.liquid,num(s.contribution),num(s.rate),LADDER);
  const nextIdx=LADDER.findIndex(v=>t.goalBase<v);
  g.innerHTML=goals.map((x,i)=>{const done=t.goalBase>=x.v, isNext=i===nextIdx;const prev=i?LADDER[i-1]:0;
    const p=done?100:Math.max(0,Math.min(100,(t.goalBase-prev)/(x.v-prev)*100));
    return `<div class="goal" ${isNext?'style="background:var(--accent-soft);margin:0 -10px;padding:10px;border-radius:8px"':""}>
    <div class="row"><span class="name">${done?"✓ ":""}${x.n}${isNext?' <span class="pill hold">следующий этап</span>':""}</span>
    <span class="muted">${done?"пройдено":"осталось "+mln(x.v-t.goalBase)+" · "+monthsLabel(pr.hit[x.v])}</span></div>
    <div class="bar"><i style="width:${p}%" ${done?'class="brass"':""}></i></div></div>`}).join("");
  document.getElementById("proj").innerHTML=projChart(pr.pts,goals.filter(x=>x.v>t.goalBase||x.v===40e6));
}
function projChart(pts,goals){
  const W=640,H=230,pl=56,pr=12,pt=12,pb=26;
  const maxM=pts[pts.length-1].m, maxV=Math.max(goals[goals.length-1].v*1.08,pts[pts.length-1].v);
  const x=m=>pl+(W-pl-pr)*m/maxM, y=v=>pt+(H-pt-pb)*(1-v/maxV);
  const step=maxV>8e7?2e7:maxV>3e7?1e7:5e6; let grid="";
  for(let v=0;v<=maxV;v+=step) grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v/1e6} млн</text>`;
  let xt=""; const ys=Math.ceil(maxM/12);
  for(let yr=0;yr<=ys;yr+=Math.max(1,Math.round(ys/6))){const m=yr*12;if(m>maxM)break;xt+=`<text x="${x(m)}" y="${H-6}" text-anchor="middle">${new Date().getFullYear()+yr}</text>`}
  const gl=goals.map(gg=>`<line x1="${pl}" x2="${W-pr}" y1="${y(gg.v)}" y2="${y(gg.v)}" stroke="var(--brass)" stroke-dasharray="4 4"/><text x="${W-pr}" y="${y(gg.v)-5}" text-anchor="end" style="fill:var(--brass)">${gg.n}</text>`).join("");
  const line=pts.map((p,i)=>(i?"L":"M")+x(p.m).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const area=line+` L${x(maxM)} ${y(0)} L${x(0)} ${y(0)} Z`;
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px;display:block;margin-top:10px" role="img" aria-label="Прогноз капитала">
    ${grid}${xt}<path d="${area}" fill="var(--accent-soft)"/>${gl}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="${x(0)}" cy="${y(pts[0].v)}" r="4" fill="var(--accent)"/></svg></div>`;
}

function barChart(c,d,r){
  const W=640,H=170,pl=40,pb=22,pt=10, max=Math.max(1000,...c.map((v,i)=>v+d[i]+r[i]));
  const bw=(W-pl-10)/12, y=v=>(H-pb-pt)*v/max;
  const raw=max/4, p10=Math.pow(10,Math.floor(Math.log10(raw))), step=[1,2,5,10].map(m=>m*p10).find(s=>s>=raw);
  let g=""; for(let v=0;v<=max;v+=step) g+=`<line x1="${pl}" x2="${W-10}" y1="${H-pb-y(v)}" y2="${H-pb-y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${H-pb-y(v)+4}" text-anchor="end">${k(v)}</text>`;
  const bars=c.map((cv,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;let yb=H-pb,s="";
    for(const [v,col] of [[cv,"var(--accent)"],[d[i],"var(--brass)"],[r[i],"var(--up)"]]){if(!v)continue;const h=y(v);yb-=h;s+=`<rect x="${x}" y="${yb}" width="${w}" height="${h}" fill="${col}" rx="2"/>`}
    return s+`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${MONTHS[i]}</text>`}).join("");
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px;display:block" role="img" aria-label="Выплаты по месяцам">${g}${bars}</svg></div>
  <div class="legend"><span><i style="background:var(--accent)"></i>купоны</span><span><i style="background:var(--brass)"></i>дивиденды</span><span><i style="background:var(--up)"></i>аренда / ЗПИФ</span></div>`;
}

// ---------- events ----------

  const im=document.getElementById("imp"); if(im) im.onchange=()=>{const f=im.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result); for(const key of ["settings","accounts","positions","payouts","months"]) if(d[key]) state[key]=d[key];
      saveLocal(); render();}catch(e){const b=document.getElementById("banner"); b.hidden=false; b.textContent="Не удалось прочитать файл: выберите JSON, сохранённый кнопкой «Экспорт»."}};

    const id=document.getElementById("m-id").value, body={income:num(document.getElementById("m-inc").value),expense:num(document.getElementById("m-exp").value),note:""};

  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x===b));
  try{localStorage.setItem("kapital-tab",tab)}catch(e){} render(); window.scrollTo({top:0})});
try{const t=localStorage.getItem("kapital-tab");if(t){tab=t;document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===t))}}catch(e){}

// ---------- boot ----------
render();
(async()=>{
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null }catch(e){ db=null }
  if(!db){ loadLocal(); state.loaded=true; persistOK=false; render(); return }
  persistOK=true; let first={settings:false,accounts:false,positions:false,payouts:false,months:false};
  const ready=()=>{if(!state.loaded&&Object.values(first).every(Boolean)){state.loaded=true;render()}else if(state.loaded)schedule()};
  db.doc("settings/main").onSnapshot(s=>{if(s.exists)Object.assign(state.settings,s.data());first.settings=true;ready()},()=>{first.settings=true;ready()});
  for(const c of ["accounts","positions","payouts","months"]){
    db.collection(c).onSnapshot(snap=>{
      // keep local edits that are still debouncing
      state[c]=snap.docs.map(d=>{const loc=state[c].find(x=>x.id===d.id);return timers[c+d.id]&&loc?loc:{id:d.id,...d.data()}});
      first[c]=true; ready()},e=>{first[c]=true;ready();err(e)});
  }
  setTimeout(()=>{if(!state.loaded){state.loaded=true;render()}},8000);
})();
})();
</script>
