<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Капитал → 40 млн</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: sticky top bar with net worth, tab strip, one working panel per tab; ledger-style tables */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F6F8FA; --line:#DCE2E8;
  --ink:#16222E; --muted:#5E6B78; --faint:#8D99A5;
  --accent:#1D5C8F; --accent-soft:#E2ECF5; --brass:#B07A1E;
  --up:#1E8A52; --up-soft:#E3F3EA; --down:#C23B32; --down-soft:#F8E6E4; --warn:#A86A0B; --warn-soft:#FBF0DC;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s0:#B9C3CC; --s4-ink:#0b0b0b; --s0-ink:#16222E;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#17202A; --surface2:#1D2833; --line:#2A3744;
  --ink:#E6ECF1; --muted:#9AA8B5; --faint:#6F7E8C;
  --accent:#6FA8DA; --accent-soft:#1E3346; --brass:#D9A24A;
  --up:#4FC184; --up-soft:#173024; --down:#EE7166; --down-soft:#3A1E1C; --warn:#E3A84A; --warn-soft:#3A2C14; color-scheme:dark;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s0:#4A5866; --s4-ink:#ffffff; --s0-ink:#E6ECF1}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#17202A; --surface2:#1D2833; --line:#2A3744;
  --ink:#E6ECF1; --muted:#9AA8B5; --faint:#6F7E8C;
  --accent:#6FA8DA; --accent-soft:#1E3346; --brass:#D9A24A;
  --up:#4FC184; --up-soft:#173024; --down:#EE7166; --down-soft:#3A1E1C; --warn:#E3A84A; --warn-soft:#3A2C14; color-scheme:dark;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s0:#4A5866; --s4-ink:#ffffff; --s0-ink:#E6ECF1}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:12px}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin-right:auto}
.brand span{color:var(--accent)}
.hstat{display:flex;flex-direction:column;align-items:flex-end}
.hstat small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.hstat b{font-size:18px;font-weight:600}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
nav button{border:0;background:transparent;color:var(--muted);font:500 14px var(--body);padding:8px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:20px 48px;display:grid;gap:18px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:10px 14px;font-size:13px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:15px;font-weight:600;margin:0 0 12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel h2 .sub{font-weight:400;font-size:13px;color:var(--muted)}
.kpi small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.kpi .v{font-family:var(--display);font-weight:500;font-size:24px;letter-spacing:-.02em}
.kpi .n{font-size:13px;color:var(--muted);margin-top:4px}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.goal{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.goal:last-child{border-bottom:0}
.goal .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.goal .name{font-weight:600}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar i.brass{background:var(--brass)}
.scen{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0}
input[type=number]{text-align:right}
.scen input{width:130px}
.tablewrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;white-space:nowrap}
td input,td select{width:100%;padding:5px 7px;background:transparent;border-color:transparent}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{background:var(--surface2);border-color:var(--accent)}
tfoot td{font-weight:600;border-bottom:0;padding-top:10px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px var(--body);padding:7px 12px;border-radius:7px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--faint);padding:4px 8px}
.btn.ghost:hover{color:var(--down)}
.btn.ghost.armed{color:var(--down);background:var(--down-soft)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.hold{background:var(--accent-soft);color:var(--accent)}
.pill.sell{background:var(--down-soft);color:var(--down)}
.pill.buy{background:var(--up-soft);color:var(--up)}
.pill.watch{background:var(--warn-soft);color:var(--warn)}
td.v-cell select{font-weight:500}
.alloc{display:grid;gap:8px}
.alloc .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13px}
.alloc .bar{grid-column:1/-1;height:6px}
.alloc .row .sm{display:block;font-size:12px;color:var(--faint);margin-top:1px}
.alloc .row.tot{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.alloc .row b.big2{font:500 20px var(--display);letter-spacing:-.02em}
svg text{fill:var(--muted);font-family:var(--body);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{font-size:12px;color:var(--faint);margin-top:10px;max-width:70ch}
.addform{display:flex;gap:8px;flex-wrap:wrap;align-items:end;padding-top:12px;margin-top:12px;border-top:1px dashed var(--line)}
.addform input,.addform select{width:auto}
.empty{padding:24px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border-radius:99px;padding:3px}
.seg button{border:0;background:transparent;font:500 13px var(--body);color:var(--muted);padding:4px 12px;border-radius:99px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.modal-back{position:fixed;inset:0;background:rgba(10,16,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;z-index:50;overflow:auto}
.modal-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(880px,100%);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal-card h2{margin:0 0 4px;font-size:17px}
.modal-card .muted{margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1}
/* live sync pill in the header */
.sync{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font:500 12px var(--body);padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap;max-width:100%}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--up);flex:none}
.sync b{font-weight:600;color:var(--ink)}
.sync.busy i{background:var(--accent)}
.sync.stale i{background:var(--warn)}
.sync.err{color:var(--down);background:var(--down-soft);border-color:transparent}
.sync.err i{background:var(--down)}
/* hero: monthly contribution */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;align-items:start;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.cap{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.big{display:flex;align-items:baseline;gap:8px;margin:6px 0 12px}
.big input{font:500 34px var(--display);letter-spacing:-.02em;width:100%;max-width:300px;text-align:left;padding:6px 12px;border-radius:9px}
.big span{font:500 22px var(--display);color:var(--muted)}
.hero input[type=range]{width:100%;max-width:420px;accent-color:var(--accent);padding:0;border:0;background:transparent;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chips .btn{padding:5px 10px;font-size:12px}
.hgoals{display:grid;gap:10px}
.hgoal{border:1px solid var(--line);border-radius:9px;padding:12px 14px;display:grid;gap:3px;background:var(--surface)}
.hgoal b{font:500 22px var(--display);letter-spacing:-.02em}
.hgoal .d{font-size:13px;font-weight:500}
.hsum{font-size:13px;color:var(--muted);margin:2px 0 0}
/* field hints */
.fh{max-width:220px}
.hint{font-size:11px;color:var(--faint);line-height:1.35}
.lead{font-size:15px;line-height:1.55;margin:0;max-width:80ch}
details>summary{cursor:pointer}
/* part-to-whole bar */
.segbar{display:flex;gap:2px;height:28px;margin:4px 0 14px}
.segbar span{display:flex;align-items:center;padding-left:7px;border-radius:4px;font:600 12px var(--body);white-space:nowrap;min-width:0}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px;flex:none}
.seg.chips{flex-wrap:wrap;border-radius:16px}
.pfbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:0 0 14px}
.minibar{display:flex;gap:2px;height:12px;min-width:120px}
.minibar i{display:block;border-radius:3px;min-width:3px}
a.acclink{color:var(--ink);text-decoration:none;border-bottom:1px dashed var(--muted)}
a.acclink:hover{border-bottom-style:solid}
.meter{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.src{font-size:12px;color:var(--muted)}
.share{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.share .meter{width:64px;margin:0;flex:none}
.share span{min-width:40px;text-align:right}
main a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}
  .sync.busy i{animation:pulse 1s ease-in-out infinite}
  .flash{animation:flash 1.8s ease}}
@keyframes pulse{50%{opacity:.25}}
@keyframes flash{0%{background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft)}100%{background:transparent;box-shadow:0 0 0 4px transparent}}
.hstat b{border-radius:5px}
/* snowball, analysis, advice */
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:0 0 14px}
.trio>div{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:grid;gap:3px;align-content:start}
.trio b{font:500 21px var(--display);letter-spacing:-.02em}
.trio .muted{font-size:12px;line-height:1.35}
.todo>div{display:grid;grid-template-columns:118px minmax(0,1fr);gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.todo>div:first-child{padding-top:2px}
.todo>div:last-child{border-bottom:0}
.todo .pill{justify-self:start;margin-top:1px}
.todo p{margin:3px 0 0;font-size:13px;max-width:90ch}
@media (max-width:560px){.todo>div{grid-template-columns:minmax(0,1fr)}}
.rng{position:relative;display:inline-block;width:56px;height:4px;background:var(--line);border-radius:99px;vertical-align:middle;margin-right:7px}
.rng i{position:absolute;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-left:-5px;box-shadow:0 0 0 2px var(--surface)}
/* expenses */
.xg{border-bottom:1px solid var(--line)}
.xg:last-child{border-bottom:0}
.xg>summary{list-style:none;display:grid;grid-template-columns:minmax(120px,250px) minmax(0,1fr) 96px 44px;gap:4px 12px;align-items:center;padding:6px 4px;font-size:13px;border-radius:6px;cursor:pointer}
.xg>summary::-webkit-details-marker{display:none}
.xg>summary:hover{background:var(--surface2)}
.xg>summary .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xg>summary .nm::before{content:"›";display:inline-block;width:12px;margin-right:4px;text-align:center;color:var(--faint)}
.xg[open]>summary .nm::before{transform:rotate(90deg)}
.xg>summary b{text-align:right;font-weight:600}
.xg>summary>.muted{text-align:right}
.gb{display:block;height:10px}
.gb i{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px}
.xg .tablewrap{margin:2px 0 12px}
@media (max-width:560px){.xg>summary{grid-template-columns:minmax(0,1fr) auto 40px;row-gap:3px}.xg>summary .gb{grid-column:1/-1;grid-row:2;height:6px}}
.bar i.over{background:var(--down)}
.xm{display:grid;gap:9px}
.xr{display:grid;grid-template-columns:minmax(0,1fr) auto 122px;gap:3px 10px;align-items:baseline;font-size:13px}
.xr .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xr .tl{text-align:right;font-size:12px;white-space:nowrap}
.xr .amt{white-space:nowrap}
.xr .bar{grid-column:1/-1;height:5px}
@media (max-width:560px){.xr{grid-template-columns:minmax(0,1fr) auto}.xr .tl{grid-column:1/-1;grid-row:3;text-align:left}}
.xinv>div{gap:4px}
.xinv b{font:500 22px var(--display);letter-spacing:-.02em}
.legend i.ln{width:18px;height:0;border-top:2px dashed var(--ink);border-radius:0;background:none;vertical-align:3px;opacity:.75}
tr.xsec td{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding-top:14px}
.xbt td input{min-width:96px;text-align:right}
input.xmoney{text-align:right}
#x-how>summary{list-style:none}
#x-how>summary::-webkit-details-marker{display:none}
#x-how>summary::after{content:" ›";color:var(--faint)}
#x-how[open]>summary::after{content:" ⌄"}
</style>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">Капитал <span>→ 40 млн</span></div>
      <button class="sync" id="h-sync" type="button" hidden title="Открыть «Подключения»"><i></i><span id="h-sync-t">Т-Банк</span></button>
      <div class="hstat"><small>Чистый капитал</small><b id="h-nw">—</b></div>
      <div class="hstat"><small>Ликвидно</small><b id="h-liq">—</b></div>
      <div class="hstat" title="Факт: выплаты за последние 12 месяцев, делённые на 12"><small>Пассив / мес</small><b id="h-pass">—</b></div>
      <div class="hbtns">
        <button class="btn" id="btn-port" title="Загрузить CSV/Excel с бумагами — обновит позиции и создаст нужный брокерский счёт">Портфель из файла</button>
        <button class="btn" id="btn-pay" title="Загрузить CSV/Excel с дивидендами и купонами">Выплаты из файла</button>
        <button class="btn primary" id="btn-calc" title="Сложный процент и сроки достижения всех целей">Калькулятор</button>
      </div>
      <input type="file" id="f-port" accept=".csv,.xlsx,.xls,.txt,.json" hidden>
      <input type="file" id="f-pay" accept=".csv,.xlsx,.xls,.txt,.json" hidden>
      <input type="file" id="f-exp" accept=".zip,.csv,.txt,.html,.htm,.json,.xlsx,.xls,.md" hidden>
    </div>
    <nav role="tablist" id="tabs">
      <button role="tab" data-tab="overview" aria-selected="true">Обзор и цель</button>
      <button role="tab" data-tab="portfolio" aria-selected="false">Портфель</button>
      <button role="tab" data-tab="analysis" aria-selected="false">Анализ бумаг</button>
      <button role="tab" data-tab="advice" aria-selected="false">Рекомендации</button>
      <button role="tab" data-tab="income" aria-selected="false">Пассив и дивиденды</button>
      <button role="tab" data-tab="plans" aria-selected="false">Планы</button>
      <button role="tab" data-tab="accounts" aria-selected="false">Счета</button>
      <button role="tab" data-tab="positions" aria-selected="false">Бумаги</button>
      <button role="tab" data-tab="structure" aria-selected="false">Штанга</button>
      <button role="tab" data-tab="payouts" aria-selected="false">Выплаты</button>
      <button role="tab" data-tab="expenses" aria-selected="false">Расходы</button>
      <button role="tab" data-tab="budget" aria-selected="false">Бюджет</button>
      <button role="tab" data-tab="tasks" aria-selected="false">Налоги и задачи</button>
      <button role="tab" data-tab="connect" aria-selected="false">Подключения</button>
    </nav>
  </div>
</header>

<div class="wrap"><main id="main"></main></div>

<script>
(function(){
"use strict";
const KIND_LABEL={broker:"Брокерский",iis:"ИИС",cash:"Деньги / вклад",foreign:"Зарубежный счёт"};
const LIQUID=["broker","iis","cash","foreign"];
const VERDICT={hold:"Держать",buy:"Докупать",sell:"Продать",watch:"Решить"};
const PKIND={share:"Акция",bond:"Облигация",fund:"Фонд / ЗПИФ",other:"Другое"};
const PAYKIND={coupon:"Купон",dividend:"Дивиденд",rent:"Аренда / ЗПИФ",other:"Другое"};
const MONTHS=["Янв","Фев","Мар","Апр","Май","Июн","Июл","Авг","Сен","Окт","Ноя","Дек"];

const nf=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0});

const k=n=>{const a=Math.abs(n||0);return a>=1000?(a/1000).toLocaleString("ru-RU",{maximumFractionDigits:a>=1e4?0:1})+"к":nf.format(Math.round(a))};

// ---------- derived ----------
function totals(){
  let assets=0,debts=0,liquid=0,car=0;
  for(const a of state.accounts){
    const v=num(a.value)+num(a.cash);
    if(a.kind==="debt"){debts+=Math.abs(num(a.value));continue}
    assets+=v; if(LIQUID.includes(a.kind)) liquid+=v; if(a.kind==="car") car+=v;
  }
  const nw=assets-debts;
  const now=new Date(), from=new Date(now.getFullYear(),now.getMonth()-11,1);
  const last12=state.payouts.filter(p=>{const d=new Date(p.month+"-01");return d>=from}).reduce((s,p)=>s+num(p.amount),0);
  return {assets,debts,liquid,car,nw,goalBase:state.settings.base==="all"?nw-car:liquid,passive:last12/12};
}
function project(start,liquid,monthly,ratePct,targets){
  // liquid part compounds monthly, rest (property equity) stays flat; contributions go to liquid
  const r=ratePct/100/12, fixed=start-liquid; let L=liquid; const pts=[{m:0,v:start}]; const hit={};
  for(let m=1;m<=12*20;m++){L=L*(1+r)+monthly; const v=fixed+L; if(m%3===0) pts.push({m,v});
    for(const t of targets) if(hit[t]==null && v>=t) hit[t]=m;
    if(targets.every(t=>hit[t]!=null) && m>=36 && m%12===0 && v>Math.max(...targets)*1.08) break;}
  return {pts,hit};
}
const monthsLabel=m=>{if(m==null)return "дальше 20 лет";const d=new Date();d.setMonth(d.getMonth()+m);const y=Math.floor(m/12),mm=m%12;
  return d.toLocaleDateString("ru-RU",{month:"short",year:"numeric"})+" · "+(y?y+" г. ":"")+(mm?mm+" мес":"")};

}

function purgeLegacyAccounts(){

  for(const a of bad){
    state.accounts=state.accounts.filter(x=>x.id!==a.id);
    if(db)db.collection("accounts").doc(a.id).delete().catch(()=>{});else saveLocal();
  }
}

}

}
function removeMany(coll,ids){const set=new Set(ids);

}

function renderHero(){
  const out=document.getElementById("hero-out"); if(!out) return;
  const t=totals(), s=state.settings, c=num(s.contribution), r=num(s.rate), g=num(s.divGrowth);
  const changed=c!==heroBase.c||r!==heroBase.r, was=`${nf.format(heroBase.c)} ₽${r!==heroBase.r?" и "+String(heroBase.r).replace(".",",")+"%":""}`;
  const delta=(m,m0)=>!changed||m==null||m0==null||m===m0?(changed&&m===m0?`<span class="d muted">срок не изменился</span>`:"")
    :`<span class="d ${m<m0?"up":"down"}">${m<m0?"на "+durLabel(m0-m)+" раньше":"на "+durLabel(m-m0)+" позже"}, чем при ${was}</span>`;
  const card=(label,m,m0,cap)=>`<div class="hgoal"><span class="cap">${label}</span><b>${m==null?"дальше "+(cap||20)+" лет":dateLabel(m)}</b>
    <span class="muted">${m==null?"увеличьте пополнение или доходность":m===0?"уже сейчас":"через "+durLabel(m)}</span>${delta(m,m0)}</div>`;
  const next=LADDER.find(v=>v>t.goalBase), T=[...new Set([next,40e6].filter(v=>v&&v>t.goalBase))];
  const now=project(t.goalBase,t.liquid,c,r,T).hit, base=project(t.goalBase,t.liquid,heroBase.c,heroBase.r,T).hit;
  const hp=hitIncome(g,c), hp0=hitIncome(g,heroBase.c);
  let html=T.length?T.map(v=>card(v===next&&v!==40e6?`Следующий этап · ${v/1e6} млн`:"Главная цель · 40 млн",now[v],base[v])).join("")
    :`<div class="hgoal"><span class="cap">Главная цель · 40 млн</span><b>достигнута</b></div>`;
  html+=card(`Пассив ${nf.format(num(s.goalIncome))} ₽ в месяц`,hp,hp0,30);
  if(T.includes(40e6)&&now[40e6]!=null){const m10=project(t.goalBase,t.liquid,c+10000,r,[40e6]).hit[40e6];
    if(m10!=null&&now[40e6]-m10>0) html+=`<p class="hsum">Каждые +10 000 ₽ в месяц приближают 40 млн примерно на ${durLabel(now[40e6]-m10)}.</p>`}
  out.innerHTML=html;
  const rs=document.getElementById("h-reset"); if(rs){rs.hidden=!changed}
}
function projChart(pts,goals){
  const W=640,H=230,pl=56,pr=12,pt=12,pb=26;
  const maxM=pts[pts.length-1].m, maxV=Math.max(goals[goals.length-1].v*1.08,pts[pts.length-1].v);
  const x=m=>pl+(W-pl-pr)*m/maxM, y=v=>pt+(H-pt-pb)*(1-v/maxV);
  const step=maxV>8e7?2e7:maxV>3e7?1e7:5e6; let grid="";

// Payouts of the last 12 months that belong to these accounts: T-Bank ones by account; a typed-in payout goes to
// the account that holds the most of the paper with that name, so a paper kept at two brokers is not counted twice
function passiveOf(accs){
  const tids=new Set(accs.filter(isAuto).map(a=>a.tid)), man=new Set(accs.filter(a=>!isAuto(a)).map(a=>a.id));
  const manPos=state.positions.filter(p=>{const a=state.accounts.find(x=>x.id===p.account);return a&&!isAuto(a)});
  const owner=x=>{let best=null;for(const p of manPos) if(nameLike(x.name,p.name)&&(!best||num(p.value)>num(best.value))) best=p;return best&&best.account};
  return state.payouts.filter(x=>inLast12(x.month)&&(x.src==="tinvest"?tids.has(x.tacc):!x.src&&man.has(owner(x)))).reduce((s,x)=>s+num(x.amount),0)/12;
}
function pfData(only){
  const accs=state.accounts.filter(a=>LIQUID.includes(a.kind)&&(!only||only.has(a.id))), ids=new Set(accs.map(a=>a.id));
  const sum={bond:0,share:0,fund:0,cash:0,other:0,none:0}, cnt={bond:0,share:0,fund:0,other:0}, held=[], capped=[];
  const rows=accs.map(a=>{
    const auto=isAuto(a), val=num(a.value), cash=num(a.cash);
    // A T-Bank account holds exactly what the broker reports: hand-typed leftovers there are not counted again
    const ps=state.positions.filter(p=>p.account===a.id&&num(p.value)>0&&(!auto||p.tuid));
    const inPos=ps.reduce((x,p)=>x+num(p.value),0), f=inPos>val?Math.max(0,val)/inPos:1;
    if(inPos-val>Math.max(1000,val*0.01)) capped.push({a,inPos,val});
    const rs={bond:0,share:0,fund:0,other:0,cash,none:val-inPos*f};
    for(const p of ps){const cv=num(p.value)*f;held.push({...p,cv});sum[clsOf(p)]+=cv;cnt[clsOf(p)]++;rs[clsOf(p)]+=cv}
    sum.none+=val-inPos*f; sum.cash+=cash;
    return {a,cash,total:val+cash,sum:rs};
  }).sort((x,y)=>y.total-x.total);
  const whole=rows.reduce((x,r)=>x+r.total,0); // = totals().liquid
  const loose=only?[]:state.positions.filter(p=>num(p.value)>0&&!ids.has(p.account));
  const wc=held.filter(p=>num(p.cost)>0), inv=wc.reduce((x,p)=>x+num(p.cost),0), pnl=wc.reduce((x,p)=>x+num(p.value)-num(p.nkd)-num(p.cost),0);

  return {accs,held,sum,cnt,rows,whole,inv,pnl,empty,capped,loose};
}

// ----- Snowball: what grows the capital each month — your contribution, payouts or prices -----
// Same model as «Путь к 40 млн»: monthly compounding at the hero's rate, flat contribution. The rate is split into
// payouts (as much as the last 12 months brought, reinvested) and price growth (the rest).
function snowSim(){
  const s=state.settings, t=totals(), b=incomeBase(), r=Math.max(0,num(s.rate))/100, C=Math.max(0,num(s.contribution));
  const y=Math.min(r,b.curYield!=null?b.curYield/100:0), g=r-y, now=new Date(), y0=now.getFullYear(), m0=now.getMonth(), by={};
  let L=Math.max(0,t.liquid); const first={c:C,p:L*y/12,g:L*g/12};
  for(let i=0;i<120+(12-m0);i++){
    const yr=y0+Math.floor((m0+i)/12), pm=L*y/12, gm=L*g/12, o=by[yr]||(by[yr]={year:yr,c:0,p:0,g:0,n:0});
    o.c+=C;o.p+=pm;o.g+=gm;o.n++; L+=C+pm+gm; o.end=L;
  }
  const rows=Object.values(by).filter(o=>o.year>y0&&o.n===12).map(o=>({year:o.year,c:o.c/12,p:o.p/12,g:o.g/12,end:o.end}));
  const over=first.p+first.g>first.c?"now":(rows.find(o=>o.p+o.g>o.c)||{}).year||null;
  return {first,rows,y,g,r,C,over,cross:r>0&&C>0?C*12/r:null};
}
const SNOWSEG=[["c","var(--s1)","пополнение с зарплаты"],["p","var(--s2)","купоны и дивиденды"],["g","var(--s3)","рост цен"]];
const fmtM=v=>v>=1e6?(v/1e6).toLocaleString("ru-RU",{maximumFractionDigits:2})+" млн":k(v);
function snowChart(S){
  const rows=[{year:"сейчас",...S.first},...S.rows], W=660,H=250,pl=48,pr=10,pt=34,pb=24, n=rows.length, tot=o=>o.c+o.p+o.g;
  const max=Math.max(1,...rows.map(tot)), raw=max/4, p10=Math.pow(10,Math.floor(Math.log10(raw))), step=[1,2,5,10].map(q=>q*p10).find(v=>v>=raw), top=Math.ceil(max/step)*step;
  const base=H-pb, sy=v=>(base-pt)*v/top, slot=(W-pl-pr)/n, bw=Math.min(24,slot*0.6);
  // a column: square at the baseline, 4px rounded top on the last segment
  const col=(x,y,w,h,r)=>h<=0?"":r&&h>r?`M${x} ${y+h}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h}Z`:`M${x} ${y+h}V${y}H${x+w}V${y+h}Z`;
  let grid=""; for(let v=0;v<=top+1e-6;v+=step){const y=(base-sy(v)).toFixed(1); grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl-6}" y="${(+y+4).toFixed(1)}" text-anchor="end">${v?fmtM(v):"0"}</text>`}
  let bars="", mark="";
  rows.forEach((o,i)=>{
    const cx=pl+slot*(i+0.5), x=+(cx-bw/2).toFixed(1), segs=SNOWSEG.filter(([key])=>o[key]>0); let yb=base, s="";
    segs.forEach(([key,c],j)=>{const h=sy(o[key]), gap=j?2:0; s+=`<path d="${col(x,+(yb-h).toFixed(1),+bw.toFixed(1),+(h-gap).toFixed(1),j===segs.length-1?4:0)}" fill="${c}"/>`; yb-=h});
    const lab=i===0?"Сейчас":o.year+" год";
    const tip=`${lab}: прирост ≈ ${rub(tot(o))} в месяц — пополнение ${rub(o.c)}, купоны и дивиденды ${rub(o.p)}, рост цен ${rub(o.g)}`;
    const cap=i===0||i===n-1?`<text x="${cx.toFixed(1)}" y="${(base-sy(tot(o))-6).toFixed(1)}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${fmtM(tot(o))}</text>`:"";
    bars+=`<g><title>${tip}</title><rect x="${(pl+slot*i).toFixed(1)}" y="${pt}" width="${slot.toFixed(1)}" height="${base-pt}" fill="transparent"/>${s}${cap}<text x="${cx.toFixed(1)}" y="${H-7}" text-anchor="middle">${i===0?"сейчас":o.year}</text></g>`;
    if(S.over===o.year){const xl=+(pl+slot*i).toFixed(1), right=xl>W*0.55;
      mark=`<line x1="${xl}" x2="${xl}" y1="${pt-14}" y2="${base}" stroke="var(--muted)" stroke-dasharray="3 3"/><text x="${right?xl-5:xl+5}" y="${pt-18}" text-anchor="${right?"end":"start"}" style="fill:var(--ink)">с ${o.year} года рынок даёт больше, чем пополнение</text>`}
  });
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:500px;max-width:880px;display:block;margin-top:6px" role="img" aria-label="Прирост капитала в месяц по годам: пополнение, купоны и дивиденды, рост цен">${grid}${mark}${bars}</svg></div>
  <div class="legend">${SNOWSEG.map(([,c,l])=>`<span><i style="background:${c}"></i>${l}</span>`).join("")}<span class="muted">наведите на столбик — точные суммы</span></div>`;
}
// Money put into the T-Bank accounts over the last 12 months, net of withdrawals (from the operation history)
function depositsLast12(){
  if(!tinv.token) return null;
  const done=tinv.flowsDone||{}, fl=tinv.flows||{}, ok=(tinv.accs||[]).filter(d=>d.ok); if(!ok.length||ok.some(d=>!done[d.id])) return null;
  const from=Date.now()-365*864e5; let s=0; for(const d of ok) for(const [day,amt] of Object.values(fl[d.id]||{})) if(Date.parse(day)>=from) s+=amt||0;
  return s;
}

function adviceAlloc(P){

  if(rest>1&&ws>0) for(const b of w) buy[b]+=rest*num(tg[b])/ws;

  for(const b of keys) buy[b]=Math.floor(buy[b]/1000)*1000;
  const left=pool-keys.reduce((x,b)=>x+buy[b],0), big=keys.reduce((m,b)=>buy[b]>buy[m]?b:m,keys[0]); if(left>0&&buy[big]>0) buy[big]+=left;

}

function barChart(c,d,r){

  let g=""; for(let v=0;v<=max;v+=step) g+=`<line x1="${pl}" x2="${W-10}" y1="${H-pb-y(v)}" y2="${H-pb-y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${H-pb-y(v)+4}" text-anchor="end">${k(v)}</text>`;
  const bars=c.map((cv,i)=>{const x=pl+i*bw+bw*.18,w=bw*.64;let yb=H-pb,s="";

    return s+`<text x="${x+w/2}" y="${H-6}" text-anchor="middle">${MONTHS[i]}</text>`}).join("");

// Thousands of rows live under their own localStorage key, packed with a dictionary, and go into «Экспорт» too.
const EXP_LS="kapital-expenses-v1", EXP_SKIP="Не учитываем", EXP_SAMPLE=null;
const EXP_KINDS=["Обязательные","Образ жизни","Крупные и редкие","Здоровье и семья"], EXP_DAILY=["Обязательные","Образ жизни"];
const EXP_AVOID="Можно было не тратить", EXP_CUT="Можно сократить";

const xDay=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const xRu=s=>s?s.slice(8,10)+"."+s.slice(5,7)+"."+s.slice(0,4):"";
const xAdd=(ym,n)=>{let [y,m]=ym.split("-").map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+"-"+String(m).padStart(2,"0")};
const xMonth=ym=>{const [y,m]=ym.split("-").map(Number);return new Date(y,m-1,15).toLocaleDateString("ru-RU",{month:"long",year:"numeric"}).replace(/ г\.$/,"")};
const xCap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const xId=s=>{let h=5381;for(const ch of String(s))h=(h*33+ch.charCodeAt(0))>>>0;return h.toString(36)};
let EXP=null;
function expLoad(){
  if(EXP) return EXP;
  EXP={rows:[],budget:[],src:null};
  try{const p=JSON.parse(localStorage.getItem(EXP_LS)||"null");if(p)EXP=expUnpack(p)}catch(e){}
  if(!EXP.rows.length&&EXP_SAMPLE) EXP=EXP_SAMPLE();
  return EXP;
}
function expPack(x){
  const dict=[],ix=new Map(),id=s=>{s=String(s??"");let i=ix.get(s);if(i==null){i=dict.length;dict.push(s);ix.set(s,i)}return i};
  return {v:1,dict,rows:x.rows.map(r=>[r.d,r.a,id(r.c),id(r.g),id(r.k),id(r.i),id(r.v),r.n||""]),budget:x.budget,src:x.src};
}
function expUnpack(p){
  if(!p||!Array.isArray(p.rows)||!Array.isArray(p.dict)) return {rows:[],budget:[],src:null};
  const D=p.dict;
  return {rows:p.rows.map(r=>({d:String(r[0]),m:String(r[0]).slice(0,7),a:+r[1]||0,c:D[r[2]]||"",g:D[r[3]]||"",k:D[r[4]]||"",i:D[r[5]]||"",v:D[r[6]]||"",n:r[7]||""})),
    budget:Array.isArray(p.budget)?p.budget:[],src:p.src||null};
}
function expSave(){
  try{localStorage.setItem(EXP_LS,JSON.stringify(expPack(EXP)));return true}
  catch(e){toast("Браузер не дал сохранить траты: не хватило места. Они видны до перезагрузки страницы.");return false}
}

function expDate(v){

  if(e<0) throw new Error("Не получилось открыть архив. Распакуйте его и выберите файл transactions_classified.csv.");
  const cnt=dv.getUint16(e+10,true), out={}; let p=dv.getUint32(e+16,true);
  for(let j=0;j<cnt&&dv.getUint32(p,true)===0x02014b50;j++){

const expWords=s=>String(s||"").toLowerCase().replace(/ё/g,"е").split(/[^a-zа-я0-9]+/).filter(w=>w.length>=3&&!/^\d+$/.test(w)).map(w=>w.slice(0,5));

function expCalc(){

function last12ByKind(){
  const now=new Date(), from=new Date(now.getFullYear(),now.getMonth()-11,1); const r={dividend:0,coupon:0,rent:0,other:0};
  for(const p of state.payouts){const d=new Date(p.month+"-01"); if(d>=from) r[p.kind in r?p.kind:"other"]+=num(p.amount)}
  return r;
}
function addMonths(m){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+m);return d}
function monthIdx(ym){if(!ym)return 0;const [y,m]=String(ym).split("-").map(Number);const n=new Date();return Math.max(0,(y-n.getFullYear())*12+(m-1-n.getMonth()))}
function lineChart(series,opts){
  // series: [{pts:[{m,v}],color,label,dash}]
  const W=640,H=200,pl=56,pr=12,pt=12,pb=26; const all=series.flatMap(s=>s.pts);
  const maxM=Math.max(1,...all.map(p=>p.m)), maxV=Math.max(1,...all.map(p=>p.v),opts&&opts.goal||0)*1.08;
  const x=m=>pl+(W-pl-pr)*m/maxM, y=v=>pt+(H-pt-pb)*(1-v/maxV);
  const raw=maxV/4,p10=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,5,10].map(q=>q*p10).find(s=>s>=raw);
  let g="";for(let v=0;v<=maxV;v+=step)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${opts&&opts.fmt?opts.fmt(v):k(v)}</text>`;
  let xt="";const ys=Math.ceil(maxM/12);for(let yr=0;yr<=ys;yr+=Math.max(1,Math.round(ys/6))){const m=yr*12;if(m>maxM)break;xt+=`<text x="${x(m)}" y="${H-6}" text-anchor="middle">${new Date().getFullYear()+yr}</text>`}
  const goal=opts&&opts.goal?`<line x1="${pl}" x2="${W-pr}" y1="${y(opts.goal)}" y2="${y(opts.goal)}" stroke="var(--brass)" stroke-dasharray="4 4"/><text x="${W-pr}" y="${y(opts.goal)-5}" text-anchor="end" style="fill:var(--brass)">${esc(opts.goalLabel||"")}</text>`:"";
  const lines=series.map(s=>`<path d="${s.pts.map((p,i)=>(i?"L":"M")+x(p.m).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ")}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash?'stroke-dasharray="5 4"':""}/>`).join("");
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px;max-width:860px;display:block;margin-top:10px" role="img" aria-label="${esc(opts&&opts.aria||"График")}">${g}${xt}${goal}${lines}</svg></div>
  <div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}</div>`;
}

// ----- Passive income & dividend growth (по образцу «Цель → рост дивидендов» renta.life) -----
function incomeBase(){
  const t=totals(), s=state.settings, by=last12ByKind();
  const D=by.dividend, O=by.coupon+by.rent+by.other, V=t.liquid;
  const curYield=V>0&&(D+O)>0?(D+O)/V*100:null;
  return {D,O,V,curYield,divShare:(D+O)>0?D/(D+O):0.3,newYield:num(s.newYield)||12};
}
function incomeSim(years,growthPct,contrib){
  const s=state.settings,b=incomeBase();
  const gM=Math.pow(1+growthPct/100,1/12), y=b.newYield/100, idx=num(s.indexation)/100, M=contrib!=null?contrib:num(s.contribution);
  let D=b.D,O=b.O,hit=null,total=0,lastYear=0; const pts=[{m:0,v:(D+O)/12}];
  for(let m=1;m<=years*12;m++){
    D*=gM; const inc=(D+O)/12; total+=inc; if(m>years*12-12) lastYear+=inc;
    if(hit==null&&inc>=num(s.goalIncome)) hit=m;
    const c=M*Math.pow(1+idx,Math.floor((m-1)/12)); const invest=c+(s.reinvest==="all"?inc:0);
    D+=invest*y*b.divShare; O+=invest*y*(1-b.divShare);
    pts.push({m,v:inc});
  }
  return {avg:lastYear/12,total,hit,pts};
}
function hitIncome(growthPct,contrib){const r=incomeSim(30,growthPct,contrib);return r.hit}

// Manual payout records next to the broker's own ones = the same money counted twice
const manualPayouts=()=>state.payouts.filter(p=>!p.src);
function payoutDupes(){
  const syn=state.payouts.filter(p=>p.src==="tinvest"); if(!syn.length) return [];
  const nm=x=>String(x||"").toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я0-9]/g,"");
  const same=(a,b)=>{const x=nm(a),y=nm(b);return x.length>2&&y.length>2&&(x===y||x.includes(y)||y.includes(x))};
  return manualPayouts().filter(p=>syn.some(q=>q.month===p.month&&(same(q.name,p.name)||Math.abs(num(q.amount)-num(p.amount))<=Math.max(2,num(p.amount)*0.03))));
}

// ----- Plans: asset sales & big cash flows -----
const PLANKIND={sell:"Продажа актива",inflow:"Поступление",outflow:"Крупная трата"};
function planNet(p){const a=num(p.amount);return p.kind==="outflow"?-a:a}
function planTaxes(list){
  // НДФЛ: прибыль и убыток от продаж зачитываются внутри одного года
  const by={}; for(const p of list){if(p.kind!=="sell"||p.off||!num(p.cost))continue;const y=String(p.month||"").slice(0,4)||"—";by[y]=(by[y]||0)+num(p.amount)-num(p.cost)}
  const rate=num(state.settings.taxRate)/100; const res={}; for(const y in by) res[y]={gain:by[y],tax:Math.max(0,by[y])*rate}; return res;
}
function projectLumps(lumps,monthly,ratePct,targets){
  const r=ratePct/100/12; let L=totals().liquid; const pts=[{m:0,v:L}],hit={};
  for(let m=0;m<=240;m++){ if(m){L=L*(1+r)+monthly} for(const l of lumps) if(l.m===m) L+=l.v; if(m&&m%3===0)pts.push({m,v:L});
    for(const t of targets) if(hit[t]==null&&L>=t) hit[t]=m; }
  return {pts,hit};
}
function trimPts(pts,until){return pts.filter(p=>p.m<=until)}
function plans(){
  const s=state.settings, list=[...state.plans].sort((a,b)=>(a.month||"")<(b.month||"")?-1:1), act=list.filter(p=>!p.off);
  const taxes=planTaxes(list), taxTotal=Object.values(taxes).reduce((x,t)=>x+t.tax,0);
  const lumps=act.map(p=>({m:monthIdx(p.month),v:planNet(p)}));
  for(const y in taxes) if(taxes[y].tax) lumps.push({m:monthIdx((+y+1)+"-07"),v:-taxes[y].tax});
  const net=lumps.reduce((x,l)=>x+l.v,0);
  const t=totals(), next=LADDER.find(v=>v>t.liquid)||40e6, T=[next,20e6,40e6].filter((v,i,a)=>a.indexOf(v)===i);
  const a=projectLumps([],num(s.contribution),num(s.rate),T), b=projectLumps(lumps,num(s.contribution),num(s.rate),T);
  const yld=incomeBase().newYield;
  const sellPos=state.positions.filter(p=>p.verdict==="sell"&&num(p.value)>0&&!state.plans.some(x=>x.pos===p.id));
  const noCost=act.filter(p=>p.kind==="sell"&&!num(p.cost)).length;
  const until=Math.min(240,Math.max(36,...T.map(v=>Math.max(a.hit[v]||0,b.hit[v]||0)))+12);
  return `<section class="grid kpis">
    <div class="panel kpi"><small>Чистый эффект плана</small><div class="v ${net>=0?"up":"down"}">${net>=0?"+":""}${mln(net)}</div><div class="n">в ликвидный портфель, после налога</div></div>
    <div class="panel kpi"><small>Налог с продаж</small><div class="v">${rub(taxTotal)}</div><div class="n">${s.taxRate}% с прибыли за вычетом убытков года</div></div>
    <div class="panel kpi"><small>Пассив от плана</small><div class="v">${net>=0?"+":""}${rub(net*yld/100/12)}</div><div class="n">в мес при ${yld}% годовых</div></div>
    <div class="panel kpi"><small>Этап ${next/1e6} млн</small><div class="v">${b.hit[next]!=null&&a.hit[next]!=null?(a.hit[next]-b.hit[next]>0?"−"+durLabel(a.hit[next]-b.hit[next]):a.hit[next]-b.hit[next]<0?"+"+durLabel(b.hit[next]-a.hit[next]):"без изменений"):"—"}</div><div class="n">${fmtHit(b.hit[next])}</div></div>
  </section>
  <div class="panel"><h2>Планы и сценарий продажи активов <span class="sub">что продаю, что поступит, что потрачу</span></h2>
  ${list.length?`<div class="tablewrap"><table><thead><tr><th>В расчёте</th><th>Что</th><th>Вид</th><th>Месяц</th><th class="num">Сумма, ₽</th><th class="num">Цена покупки, ₽</th><th class="num">Результат</th><th>Заметка</th><th></th></tr></thead><tbody>
  ${list.map(p=>{const g=p.kind==="sell"&&num(p.cost)?num(p.amount)-num(p.cost):null;return `<tr data-coll="plans" data-id="${p.id}" ${p.off?'style="opacity:.55"':""}>
    <td><input type="checkbox" data-f="on" ${p.off?"":"checked"} aria-label="Учитывать"></td>

    <td><input data-f="month" type="month" value="${esc(p.month||"")}"></td>
    <td class="num" style="min-width:110px"><input data-f="amount" type="number" step="1000" value="${num(p.amount)}"></td>
    <td class="num" style="min-width:110px">${p.kind==="sell"?`<input data-f="cost" type="number" step="1000" value="${num(p.cost)}">`:`<span class="muted">—</span>`}</td>
    <td class="num ${g==null?"":g>=0?"up":"down"}">${g==null?(p.kind==="sell"?'<span class="muted" style="font-size:12px">нет цены покупки</span>':"—"):(g>=0?"+":"")+rub(g)}</td>

  </tbody></table></div>`:`<div class="empty">Добавьте продажу актива, поступление (премия, наследство, распродажа товара) или крупную трату.</div>`}
  <div class="toolbar">
    <button class="btn" data-addplan="sell">+ Продажа актива</button><button class="btn" data-addplan="inflow">+ Поступление</button><button class="btn" data-addplan="outflow">+ Крупная трата</button>

  </div>
  ${noCost?`<div class="banner" style="margin-top:12px">${noCost} ${noCost===1?"продажа":"продажи"} без цены покупки — налог по ним не посчитан. Для бумаг возьмите «Вложено» из приложения брокера.</div>`:""}
  ${Object.keys(taxes).length?`<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Год продаж</th><th class="num">Прибыль − убытки</th><th class="num">Налог</th></tr></thead><tbody>${Object.entries(taxes).map(([y,x])=>`<tr><td>${y}</td><td class="num ${x.gain>=0?"up":"down"}">${rub(x.gain)}</td><td class="num">${rub(x.tax)}</td></tr>`).join("")}</tbody></table></div>`:""}
  ${lineChart([{pts:trimPts(a.pts,until),color:"var(--faint)",label:"без плана",dash:true},{pts:trimPts(b.pts,until),color:"var(--accent)",label:"с планом"}],{goal:Math.max(...T),goalLabel:Math.max(...T)/1e6+" млн",fmt:v=>(v/1e6).toLocaleString("ru-RU",{maximumFractionDigits:1})+" млн",aria:"Ликвидный портфель с планом и без"})}
  <div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Этап</th><th>Без плана</th><th>С планом</th></tr></thead><tbody>
  ${T.map(v=>`<tr><td>${v/1e6} млн</td><td>${fmtHit(a.hit[v])}</td><td>${fmtHit(b.hit[v])}</td></tr>`).join("")}</tbody></table></div>
  <p class="note">Продажи и поступления попадают в ликвидный портфель в выбранном месяце, траты списываются из него. Налог считается по году: прибыль от продаж минус убытки (налоговая чистка снижает налог), платится в июле следующего года. Пополнение ${rub(num(s.contribution))}/мес и доходность ${s.rate}% — из «Обзора». Снимите галочку, чтобы сравнить сценарий без строки.</p></div>`;
}

// ----- Target structure ("штанга") -----
const BLOCKS={ofz:"Длинные ОФЗ",div:"Дивидендные акции",reit:"ЗПИФы недвижимости",corp:"Корп. облигации",cash:"LQDT / кэш",foreign:"Зарубежные",other:"Прочее"};
function guessBlock(p){
  if(p.block) return p.block; const t=String(p.ticker||"").toUpperCase(), n=String(p.name||"").toLowerCase();
  const acc=state.accounts.find(a=>a.id===p.account); if(acc&&acc.kind==="foreign") return "foreign";
  const i=p.tuid?loadAn().info[p.tuid]:null;
  if(/^SU\d|офз/.test(t+" "+n)||(i&&i.type==="bond"&&i.sector==="government")) return "ofz"; if(/LQDT|ликвидн/.test(t+" "+n)) return "cash";
  if(p.kind==="bond") return "corp"; if(p.kind==="share") return "div";
  if(p.kind==="fund") return {mm:"cash",reit:"reit",bond:"corp",gold:"other"}[fundType(p,i)]||"div";
  return "other";
}
function structure(){
  const tg=state.settings.target||{}, t=totals(); const fact={}; Object.keys(BLOCKS).forEach(b=>fact[b]=0);
  for(const p of state.positions) fact[guessBlock(p)]+=num(p.value);
  const cash=state.accounts.filter(a=>LIQUID.includes(a.kind)).reduce((x,a)=>x+num(a.cash),0); fact.cash+=cash;
  const inPos=Object.values(fact).reduce((x,v)=>x+v,0), unassigned=Math.max(0,t.liquid-inPos), base=Math.max(1,inPos);
  const tsum=Object.values(tg).reduce((x,v)=>x+num(v),0);

  return `<div class="panel"><h2>Целевая структура — «модифицированная штанга» <span class="sub">факт по разнесённым бумагам и свободным деньгам</span></h2>
  ${unassigned>1000?`<div class="banner" style="margin-bottom:12px">Не разнесено по бумагам: ${mln(unassigned)} из ${mln(t.liquid)}. Заполните «Стоит сейчас» во вкладке «Бумаги» — тогда факт будет точным.</div>`:""}
  <div class="tablewrap"><table><thead><tr><th>Блок</th><th class="num">Цель, %</th><th class="num">Факт, %</th><th class="num">Факт, ₽</th><th>Отклонение</th><th class="num">Докупить / сократить</th></tr></thead><tbody>
  ${Object.entries(BLOCKS).map(([b,l])=>{const f=fact[b]/base*100,goal=num(tg[b]),d=f-goal,need=goal/100*base-fact[b];
    return `<tr><td>${l}</td><td class="num" style="width:90px"><input data-tg="${b}" type="number" step="1" value="${goal}"></td><td class="num">${f.toFixed(1)}%</td><td class="num">${rub(fact[b])}</td>
    <td style="min-width:160px"><div class="bar" style="position:relative"><i style="width:${Math.min(100,f)}%" class="${Math.abs(d)>5?"brass":""}"></i><span style="position:absolute;top:-2px;bottom:-2px;left:${Math.min(100,goal)}%;width:2px;background:var(--ink)"></span></div></td>
    <td class="num ${need>=0?"up":"down"}">${Math.abs(need)<1000?"—":(need>0?"+":"−")+rub(Math.abs(need))}</td></tr>`}).join("")}
  </tbody><tfoot><tr><td>Итого</td><td class="num ${Math.round(tsum)!==100?"down":""}">${tsum}%</td><td class="num">100%</td><td class="num">${rub(inPos)}</td><td colspan="2"></td></tr></tfoot></table></div>
  <p class="note">Чёрная риска — цель, полоса — факт; жёлтая полоса — отклонение больше 5 п.п. Цель по умолчанию: ОФЗ 40%, дивидендные акции 15%, ЗПИФы 20%, корпоративные облигации 10%, кэш 5%, зарубежные 10%. Целевая доходность 17–20% не гарантирована, предел просадки −15–20%.</p></div>
  <div class="panel"><h2>Блок для каждой бумаги <span class="sub">определяется автоматически, можно поправить</span></h2>
  <div class="tablewrap"><table><thead><tr><th>Бумага</th><th>Тикер</th><th class="num">Стоит</th><th>Блок</th></tr></thead><tbody>
  ${pos.map(p=>`<tr data-coll="positions" data-id="${p.id}"><td>${esc(p.name)}</td><td class="muted">${esc(p.ticker)}</td><td class="num">${num(p.value)?rub(num(p.value)):"—"}</td>
  <td><select data-f="block">${Object.entries(BLOCKS).map(([v,l])=>`<option value="${v}" ${guessBlock(p)===v?"selected":""}>${l}${!p.block&&guessBlock(p)===v?" (авто)":""}</option>`).join("")}</select></td></tr>`).join("")}
  </tbody></table></div></div>`;

// One account: value, free cash and every paper with its price
async function tinvAccount(a,inst){
  const p=await tcall("OperationsService/GetPortfolio",{accountId:a.id,currency:"RUB"});
  const accId=linkAccount(a);
  const total=mv(p.totalAmountPortfolio), cash=mv(p.totalAmountCurrencies);
  putDoc("accounts",accId,{value:Math.round(total-cash),cash:Math.round(cash),synced:new Date().toISOString()});
  const ps=(p.positions||[]).filter(x=>x.instrumentType!=="currency");
  for(const x of ps) await ensureInst(inst,x.instrumentUid,{name:x.ticker,ticker:x.ticker,type:x.instrumentType});
  // Prices of foreign papers come in their own currency: scale them so each type adds up to the broker's RUB total.
  const TT={share:p.totalAmountShares,bond:p.totalAmountBonds,etf:p.totalAmountEtf,futures:p.totalAmountFutures,option:p.totalAmountOptions,sp:p.totalAmountSp};
  const rows=ps.map(x=>{const q=mv(x.quantity),cur=String((x.currentPrice&&x.currentPrice.currency)||"rub").toLowerCase();
    return {x,q,cur,native:q*(mv(x.currentPrice)+mv(x.currentNkd)),nkd:q*mv(x.currentNkd),cost:q*mv(x.averagePositionPrice)}});
  const factor={};
  for(const t in TT){const rs=rows.filter(r=>r.x.instrumentType===t);const fr=rs.filter(r=>r.cur!=="rub"),fn=fr.reduce((s,r)=>s+r.native,0);
    if(fr.length&&fn>0){const rub=rs.filter(r=>r.cur==="rub").reduce((s,r)=>s+r.native,0);factor[t]=Math.max(0,(mv(TT[t])-rub)/fn)}}
  const used=new Set();
  const brokerT=new Set(rows.map(r=>normT((inst[r.x.instrumentUid]||{}).ticker||r.x.ticker)).filter(Boolean));
  for(const r of rows){
    const uid=r.x.instrumentUid||r.x.figi, info=inst[r.x.instrumentUid]||{}, f=r.cur==="rub"?1:(factor[r.x.instrumentType]||1);
    const tk=info.ticker||r.x.ticker||"", free=q=>!used.has(q.id);
    let pos=state.positions.find(q=>free(q)&&q.tuid===uid&&q.account===accId)
      ||state.positions.find(q=>free(q)&&!q.tuid&&q.account===accId&&tk&&normT(q.ticker)===normT(tk))
      ||state.positions.find(q=>free(q)&&!q.tuid&&!q.account&&tk&&normT(q.ticker)===normT(tk))
      // typed in by hand under a ticker the broker does not use (e.g. a closed-end fund): match by name
      ||state.positions.find(q=>free(q)&&!q.tuid&&q.account===accId&&!brokerT.has(normT(q.ticker))&&nameLike(q.name,info.name));
    const body={account:accId,tuid:uid,ticker:tk||(pos&&pos.ticker)||"",qty:r.q,value:Math.round(r.native*f),nkd:Math.round(r.nkd*f),cost:Math.round(r.cost*f),fx:r.cur==="rub"?1:+f.toFixed(4)};

    used.add(id);
  }

  // records are worth 0 now (the record and its decision stay), so nothing is counted twice.

  return {accId,total,cash,positions:rows.length};
}
// Coupons and dividends (also those paid straight to a card) + a 12-month summary of every non-trade operation
async function tinvOps(a,inst,manual){
  const now=Date.now(), yearAgo=now-365*864e5;
  const full=!tinv.opsFrom[a.id];
  let from=tinv.opsFrom[a.id]||a.openedDate||new Date(now-3*365*864e5).toISOString();
  if(manual&&Date.parse(from)>now-370*864e5) from=new Date(now-370*864e5).toISOString();
  const items=[]; let cursor="",guard=0;
  do{const r=await tcall("OperationsService/GetOperationsByCursor",{accountId:a.id,from,to:new Date(now).toISOString(),cursor,limit:1000,
      state:"OPERATION_STATE_EXECUTED",withoutCommissions:true,withoutTrades:true,withoutOvernights:true});
    items.push(...(r.items||[])); cursor=r.hasNext?r.nextCursor:""}while(cursor&&++guard<30);
  if(Date.parse(from)<=yearAgo+864e5){const types={};
    for(const it of items){if(Date.parse(it.date)<yearAgo)continue;const cur=String((it.payment&&it.payment.currency)||"rub").toLowerCase();
      const key=(it.type||"?")+(cur!=="rub"?"|"+cur:"");const t=types[key]||(types[key]={n:0,sum:0});t.n++;t.sum+=mv(it.payment)}
    tinv.opsStat[a.id]={at:now,types}}
  const fl=tinv.flows[a.id]||(tinv.flows[a.id]={});
  for(const it of items){const f=flowOf(it), day=String(it.date||"").slice(0,10);
    if(f) fl[it.id]=[day,Math.round(f)]; else if(it.type==="OPERATION_TYPE_INPUT_SECURITIES"||it.type==="OPERATION_TYPE_OUTPUT_SECURITIES") fl[it.id]=[day,0,1]}
  const divs=items.filter(it=>it.type==="OPERATION_TYPE_DIVIDEND");
  let added=0, lookups=0;
  for(const it of items){
    const k0=TINV_INCOME[it.type]; if(!k0) continue;
    if(String((it.payment&&it.payment.currency)||"rub").toLowerCase()!=="rub") continue; // foreign-currency payouts are listed in the summary only
    const ext=it.type==="OPERATION_TYPE_DIV_EXT", day=String(it.date||"").slice(0,10);
    let amt=mv(it.payment); if(ext) amt=Math.abs(amt);
    if(!(amt>0)) continue;
    if(ext&&divs.some(x=>x.instrumentUid===it.instrumentUid&&String(x.date||"").slice(0,10)===day&&Math.abs(Math.abs(mv(x.payment))-amt)<1)) continue;
    const id="tinv-op-"+it.id, ex=state.payouts.find(p=>p.id===id);
    if(ex){if(!ex.tacc) putDoc("payouts",id,{tacc:a.id,tuid:it.instrumentUid||"",date:day}); continue}
    if(it.instrumentUid&&!inst[it.instrumentUid]&&lookups++<60) await ensureInst(inst,it.instrumentUid,{name:it.name,type:it.instrumentType});
    const info=inst[it.instrumentUid]||{}, t=info.type||it.instrumentType||"";
    const kind=k0==="coupon"?"coupon":(t==="etf"?"rent":"dividend");
    putDoc("payouts",id,{month:day.slice(0,7),date:day,name:info.name||it.name||"Выплата",kind,amount:Math.round(amt),src:"tinvest",tacc:a.id,tuid:it.instrumentUid||"",...(ext?{card:true}:{})});
    added++;
  }
  tinv.opsFrom[a.id]=new Date(now-14*864e5).toISOString();
  if(full) (tinv.flowsDone||(tinv.flowsDone={}))[a.id]=true;
  return added;
}
function flowOf(it){
  if(String((it.payment&&it.payment.currency)||"rub").toLowerCase()!=="rub") return 0;
  const p=Math.abs(mv(it.payment)), t=it.type;
  if(FLOW_IN.includes(t)) return p;
  if(FLOW_OUT.includes(t)||t==="OPERATION_TYPE_DIV_EXT") return -p;
  if(t==="OPERATION_TYPE_INPUT_SECURITIES"||t==="OPERATION_TYPE_OUTPUT_SECURITIES"){
    const v=p||Math.abs(mv(it.price)*(Number(it.quantity)||0)); return t==="OPERATION_TYPE_INPUT_SECURITIES"?v:-v}
  return 0;
}

function loadXLSXLib(){if(window.XLSX)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
    s.onload=()=>res();s.onerror=()=>rej(new Error("xlsx"));document.head.appendChild(s)})}

function parseCSV(text){
  text=String(text).replace(/^﻿/,"");
  const nl=text.indexOf("\n");const first=nl<0?text:text.slice(0,nl);
  const sep=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?";":",";
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cur);cur=""}
    else if(c==="\n"){row.push(cur);rows.push(row);row=[];cur=""}
    else if(c!=="\r")cur+=c}
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}

async function fileToGrid(file){
  const name=file.name.toLowerCase();
  if(name.endsWith(".json")){return {json:JSON.parse(await file.text())}}
  if(name.endsWith(".csv")||name.endsWith(".txt")) return {grid:parseCSV(await file.text())};
  await loadXLSXLib();
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
  const ws=wb.Sheets[wb.SheetNames[0]];
  return {grid:XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""})};
}

function normH(h){return String(h).toLowerCase().replace(/ё/g,"е").trim()}
function gridToObjects(grid,COLMAP){
  let hi=-1;
  for(let i=0;i<Math.min(grid.length,15);i++){
    const hs=grid[i].map(normH);
    if(Object.values(COLMAP).some(c=>c.some(k=>hs.includes(k)))){hi=i;break}}
  if(hi<0)return {headers:[],rows:[]};
  const headers=grid[hi].map(normH),idx={};
  for(const f in COLMAP)idx[f]=headers.findIndex(h=>COLMAP[f].includes(h));
  const rows=grid.slice(hi+1).map(r=>{const o={};for(const f in idx)o[f]=idx[f]>=0?r[idx[f]]:"";return o})
    .filter(o=>Object.values(o).some(v=>String(v).trim()!==""));
  return {headers:grid[hi],rows};
}

function guessKindStr(s){s=String(s||"").toLowerCase();
  if(/облиг|bond/.test(s))return "bond";
  if(/фонд|зпиф|etf|fund/.test(s))return "fund";
  return "share"}
function posFromRow(o){
  const name=String(o.name||"").trim(),ticker=String(o.ticker||"").trim().toUpperCase();
  let value=num(o.value),cost=num(o.cost);const qty=num(o.qty),price=num(o.price);
  if(!value&&qty&&price)value=qty*price;
  if(!value||(!name&&!ticker))return null;
  return {name:name||ticker,ticker,kind:guessKindStr(o.kind),cost,value,verdict:"watch",note:"импорт",...(cost?{}:{_nc:1})};
}
function aggregatePositions(list){
  const map=new Map();
  for(const p of list){const key=(p.ticker||p.name).toLowerCase();const ex=map.get(key);
    if(ex){ex.value+=p.value;if(p.cost)ex.cost+=p.cost}else map.set(key,{...p})}
  return [...map.values()];
}
const MN={"январ":1,"феврал":2,"март":3,"апрел":4,"ма":5,"июн":6,"июл":7,"август":8,"сентябр":9,"октябр":10,"ноябр":11,"декабр":12};
function monthNorm(v){
  const s=String(v||"").trim();if(!s)return "";
  let m=s.match(/(\d{4})-(\d{1,2})/);if(m)return m[1]+"-"+String(m[2]).padStart(2,"0");
  m=s.match(/(\d{1,2})[.\s](\d{4})/);if(m)return m[2]+"-"+String(m[1]).padStart(2,"0");
  m=s.match(/(\d{1,2})[.\s](\d{1,2})[.\s](\d{4})/);if(m)return m[3]+"-"+String(m[2]).padStart(2,"0");
  m=s.match(/\d{4}/);const y=m?m[0]:(new Date()).getFullYear();
  const low=s.toLowerCase();
  for(const k of Object.keys(MN)){
    if(k==="ма"){if(/ма[йя]/.test(low))return y+"-05";continue}
    if(low.includes(k))return y+"-"+String(MN[k]).padStart(2,"0")}
  return "";
}
function kindNormP(v){const s=String(v||"").toLowerCase();
  if(/дивид/.test(s))return "dividend";
  if(/купон/.test(s))return "coupon";
  if(/аренд|зпиф/.test(s))return "rent";
  return "other"}
function payoutsFromRows(rows){
  const out=[];
  for(const o of rows){
    const month=monthNorm(o.date),name=String(o.name||"").trim(),amount=num(o.amount);
    if(!month||!name||!amount)continue;
    out.push({month,name,kind:kindNormP(o.kind),amount});
  }
  return out;
}

async function handlePortfolioFile(file){
  try{
    const res=await fileToGrid(file);
    if(res.json){
      const j=res.json;
      if(Array.isArray(j.positions)){
        const list=aggregatePositions(j.positions.map(p=>({name:String(p.name||""),ticker:String(p.ticker||"").toUpperCase(),
          kind:PKIND[p.kind]?p.kind:"share",cost:num(p.cost)||num(p.value),value:num(p.value)})).filter(p=>p.value>0));
        if(list.length){importPositionsModal(list,file);return}
      }
      if(Array.isArray(j.payouts)){
        const list=payoutsFromRows(j.payouts.map(p=>({date:p.month||p.date,name:p.name,amount:p.amount,kind:p.kind})));
        if(list.length){importPayoutsModal(list,file);return}
      }
      toast("В файле нет позиций или выплат — это, похоже, резервная копия: загрузите её через «Импорт».");return;
    }
    let list=aggregatePositions(gridToObjects(res.grid,POSCOL).rows.map(posFromRow).filter(Boolean));
    if(!list.length){
      const pl=payoutsFromRows(gridToObjects(res.grid,PAYCOL).rows);
      if(pl.length){importPayoutsModal(pl,file);return}
      toast("Не нашёл колонки «название/тикер» и «сумма». Пришлите пример файла — подгоню парсер.");return;
    }
    importPositionsModal(list,file);
  }catch(e){toast(e&&e.message==="xlsx"?"Не загрузилась библиотека для Excel — проверьте интернет или сохраните файл как CSV.":"Не удалось прочитать файл: "+(e.message||e))}
}

async function handlePayoutsFile(file){
  try{
    const res=await fileToGrid(file);
    let list=[];
    if(res.json){const j=res.json;const arr=Array.isArray(j)?j:(j.payouts||[]);
      list=payoutsFromRows(arr.map(p=>({date:p.month||p.date,name:p.name,amount:p.amount,kind:p.kind})))}
    else list=payoutsFromRows(gridToObjects(res.grid,PAYCOL).rows);
    if(!list.length){toast("Не нашёл колонки «дата/месяц», «источник» и «сумма».");return}
    importPayoutsModal(list,file);
  }catch(e){toast("Не удалось прочитать файл выплат.")}
}

function openCalc(){
  const t=totals(),s=state.settings;
  openModal(`<h2>Калькулятор сложного процента</h2>
  <p class="muted">Старт — текущая база цели: ${mln(t.goalBase)}. Считаем сложный процент с ежемесячным пополнением и показываем, когда достигаются все этапы до 40 млн.</p>
  <div class="scen">
    <label class="f">Стартовая сумма, ₽<input id="c-start" type="number" step="10000" value="${Math.round(t.goalBase)}"></label>
    <label class="f">Пополнение в месяц, ₽<input id="c-contrib" type="number" step="5000" value="${s.contribution}"></label>
    <label class="f">Ставка, % годовых<input id="c-rate" type="number" step="0.5" value="${s.rate}"></label>
    <label class="f">Срок для сравнения, лет<input id="c-years" type="number" step="1" min="1" max="50" value="10"></label>
  </div>
  <div id="c-kpis" class="grid kpis" style="margin:12px 0"></div>
  <div id="c-chart"></div>
  <div id="c-goals"></div>
  <div class="toolbar"><button class="btn" id="c-save">Применить пополнение и ставку к прогнозу</button><button class="btn" id="c-close">Закрыть</button></div>`);
  const gv=id=>num(document.getElementById(id).value);
  const upd=()=>{
    const P=gv("c-start"),M=gv("c-contrib"),R=gv("c-rate")/100,T=Math.max(1,gv("c-years")||10);
    const n=T*12,i=R/12,g=Math.pow(1+i,n);
    const fvC=i?P*g+M*(g-1)/i:P+M*n;
    const C=M*n,fvS=P*(1+R*T)+C*(1+R*T/2);
    const invested=P+C;
    document.getElementById("c-kpis").innerHTML=`
      <div class="panel kpi"><small>Через ${T} лет · сложный %</small><div class="v">${mln(fvC)}</div><div class="n">прибыль ${mln(fvC-invested)} · вложено ${mln(invested)}</div></div>
      <div class="panel kpi"><small>Через ${T} лет · простой %</small><div class="v">${mln(fvS)}</div><div class="n">прибыль ${mln(fvS-invested)}</div></div>
      <div class="panel kpi"><small>Эффект реинвеста</small><div class="v up">+${mln(fvC-fvS)}</div><div class="n">насколько сложный % обгоняет простой</div></div>`;
    let L=P;const hit={},pts=[{m:0,v:P}];
    for(let m=1;m<=240;m++){L=L*(1+i)+M;if(m%12===0)pts.push({m,v:L});
      for(const tg of LADDER)if(hit[tg]==null&&L>=tg)hit[tg]=m;
      if(LADDER.every(tg=>hit[tg]!=null)&&m>=36)break}
    const ahead=LADDER.filter(v=>v>P);
    document.getElementById("c-chart").innerHTML=ahead.length?projChart(pts,ahead.map(v=>({n:(v/1e6)+" млн",v}))):`<p class="note">Все этапы уже пройдены — стартовая сумма выше 40 млн.</p>`;
    const d=m=>{const x=new Date();x.setMonth(x.getMonth()+m);return x.toLocaleDateString("ru-RU",{month:"long",year:"numeric"})};
    document.getElementById("c-goals").innerHTML=`<div class="tablewrap"><table><thead><tr><th>Этап</th><th class="num">Сумма</th><th>Достижение</th><th class="num">Срок от старта</th></tr></thead><tbody>
    ${LADDER.map(v=>{const m=hit[v];return `<tr><td>${v/1e6} млн</td><td class="num">${mln(v)}</td>
      <td>${m?d(m):'<span class="muted">дальше 20 лет</span>'}</td><td class="num">${m?monthsLabel(m):"—"}</td></tr>`}).join("")}
    </tbody></table></div>
    <p class="note">Сложный процент: капитал растёт ежемесячно, пополнение добавляется в конце каждого месяца. Простой процент — для сравнения: процент начисляется только на первоначальную сумму и взносы без реинвеста. Цели считаются от стартовой суммы целиком (все этапы — по ликвидной базе).</p>`;
  };
  ["c-start","c-contrib","c-rate","c-years"].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener("input",upd)});
  document.getElementById("c-close").onclick=closeModal;
  document.getElementById("c-save").onclick=()=>{saveSettings({contribution:gv("c-contrib"),rate:gv("c-rate")});closeModal();toast("Настройки прогноза на «Обзоре» обновлены.")};
  upd();
}

  const im=document.getElementById("imp"); if(im) im.onchange=()=>{const f=im.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result); if(!d||typeof d!=="object"||!Array.isArray(d.accounts)) throw 0; applyData(d);
      if(d.expenses&&Array.isArray(d.expenses.rows)){EXP=expUnpack(d.expenses);expSave()}
      saveLocal(); render(); toast("Данные загружены");}catch(e){const b=document.getElementById("banner"); b.hidden=false; b.textContent="Не удалось прочитать файл: выберите JSON, сохранённый кнопкой «Экспорт»."}};
    r.readAsText(f);};
  main.querySelectorAll("tr[data-coll] [data-f]").forEach(el=>{
    el.addEventListener("change",()=>{const tr=el.closest("tr");const f=el.dataset.f;
      const v=el.type==="checkbox"?el.checked:el.type==="number"?num(el.value):el.value;
      const extra=tr.dataset.coll==="accounts"&&(f==="value"||f==="cash")?{updated:new Date().toISOString()}:{};
      patch(tr.dataset.coll,tr.dataset.id,f==="on"?{off:!v}:{[f]:v,...extra})});
  });
  main.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    if(b.classList.contains("armed")) remove(b.dataset.del,b.dataset.id);
    else{b.classList.add("armed");b.textContent="Удалить?";setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent="✕"}},3000)}}));
  main.querySelectorAll("[data-addacc]").forEach(b=>b.addEventListener("click",()=>add("accounts",{name:KIND_LABEL[b.dataset.addacc],kind:b.dataset.addacc,value:0,cash:0,note:"",order:state.accounts.length})));
  const ap=document.getElementById("addpos"); if(ap) ap.onclick=()=>add("positions",{name:"Новая бумага",ticker:"",kind:"share",account:"",cost:0,value:0,verdict:"hold"});
  main.querySelectorAll("[data-pf]").forEach(b=>b.onclick=()=>{posFilter=b.dataset.pf;render()});
  main.querySelectorAll("[data-yr]").forEach(b=>b.onclick=()=>{payYear=+b.dataset.yr;render()});
  const pf=document.getElementById("payform"); if(pf) pf.addEventListener("submit",e=>{e.preventDefault();
    const amount=num(document.getElementById("p-amount").value); if(!amount) return;
    const month=document.getElementById("p-month").value; payYear=+month.slice(0,4);
    add("payouts",{month,name:document.getElementById("p-name").value.trim(),kind:document.getElementById("p-kind").value,amount})});
  const mf=document.getElementById("monthform"); if(mf) mf.addEventListener("submit",e=>{e.preventDefault();
    const id=document.getElementById("m-id").value, body={income:num(document.getElementById("m-inc").value),expense:num(document.getElementById("m-exp").value),note:""};
    const ex=state.months.find(m=>m.id===id);
    if(ex){Object.assign(ex,body); if(db) db.collection("months").doc(id).set({...body,note:ex.note||""}).catch(err); else saveLocal(); render()}
    else{state.months.push({id,...body}); if(db) db.collection("months").doc(id).set(body).catch(err); else saveLocal(); render()}});
  bindNew(); bindConnect(); bindExpenses();
  main.querySelectorAll("[data-pc]").forEach(b=>b.onclick=()=>{pfClass=b.dataset.pc;render()});
  main.querySelectorAll("[data-pfacc]").forEach(b=>b.onclick=e=>{e.preventDefault();pfAcc=b.dataset.pfacc;try{localStorage.setItem("kapital-pf-acc",pfAcc)}catch(x){}
    pfClass="all";render();if(b.tagName==="A")window.scrollTo({top:0})});
  main.querySelectorAll("[data-dropman]").forEach(b=>b.onclick=()=>{
    if(!b.classList.contains("armed")){b.dataset.label=b.textContent;b.classList.add("armed");b.textContent="Точно удалить? Нажмите ещё раз";
      setTimeout(()=>{if(b.isConnected){b.classList.remove("armed");b.textContent=b.dataset.label}},4000);return}
    const list=b.dataset.dropman==="dupes"?payoutDupes():manualPayouts();
    removeMany("payouts",list.map(p=>p.id)); toast("Удалено ручных выплат: "+list.length)});
  const sbase=document.getElementById("s-base"); if(sbase) sbase.addEventListener("change",e=>{saveSettings({base:e.target.value});render()});
  const srate=document.getElementById("s-rate"); if(srate) srate.addEventListener("input",()=>saveSettings({rate:num(srate.value)}));
  const hc=document.getElementById("h-c"); if(hc){
    const hr=document.getElementById("h-range");
    const setC=(v,from)=>{v=Math.max(0,Math.round(v)); if(from!=="input") hc.value=nf.format(v);
      if(from!=="range"){if(v>+hr.max)hr.max=v;hr.value=v} saveSettings({contribution:v})};
    hc.addEventListener("input",()=>setC(num(hc.value),"input"));
    hc.addEventListener("change",()=>{hc.value=nf.format(num(hc.value))});
    hc.addEventListener("focus",()=>hc.select());
    hr.addEventListener("input",()=>setC(+hr.value,"range"));
    main.querySelectorAll("[data-dc]").forEach(b=>b.onclick=()=>setC(num(state.settings.contribution)+(+b.dataset.dc)));
    const hb=document.getElementById("h-budget"); if(hb) hb.onclick=()=>{const rows=[...state.months].sort((a,b)=>a.id<b.id?1:-1).slice(0,6);
      setC(Math.round(rows.reduce((x,m)=>x+num(m.income)-num(m.expense),0)/rows.length/1000)*1000)};
    const hres=document.getElementById("h-reset"); if(hres) hres.onclick=()=>{if(srate)srate.value=heroBase.r; saveSettings({rate:heroBase.r}); setC(heroBase.c)};
  }
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)setTab(b.dataset.tab)});
document.getElementById("h-sync").onclick=()=>setTab("connect");
main.addEventListener("click",e=>{const b=e.target.closest("[data-goto]");if(b){e.preventDefault();setTab(b.dataset.goto)}});
try{const t=localStorage.getItem("kapital-tab");if(t){tab=t;document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.tab===t))}}catch(e){}

// header tools (static, wired once)
document.getElementById("btn-port").onclick=()=>document.getElementById("f-port").click();
document.getElementById("f-port").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)handlePortfolioFile(f)};
document.getElementById("btn-pay").onclick=()=>document.getElementById("f-pay").click();
document.getElementById("f-pay").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)handlePayoutsFile(f)};
document.getElementById("f-exp").onchange=e=>{const f=e.target.files[0];e.target.value="";if(f)handleExpensesFile(f)};
main.addEventListener("click",e=>{const b=e.target.closest("[data-xload]");if(b){e.preventDefault();document.getElementById("f-exp").click()}});
document.getElementById("btn-calc").onclick=openCalc;
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

// ---------- boot ----------
render();
(async()=>{
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null }catch(e){ db=null }
  if(!db){ loadLocal(); purgeLegacyAccounts(); state.loaded=true; persistOK=false; render(); tinvBoot(); return }
  persistOK=true; let first={settings:false}; COLLS.forEach(c=>first[c]=false);
  const ready=()=>{if(!state.loaded&&Object.values(first).every(Boolean)){state.loaded=true;purgeLegacyAccounts();render();tinvBoot()}else if(state.loaded)schedule()};
  db.doc("settings/main").onSnapshot(s=>{if(s.exists)Object.assign(state.settings,s.data());state.demo=false;first.settings=true;ready()},()=>{first.settings=true;ready()});
  for(const c of COLLS){
    db.collection(c).onSnapshot(snap=>{
      // keep local edits that are still debouncing
      state[c]=snap.docs.map(d=>{const loc=state[c].find(x=>x.id===d.id);return timers[c+d.id]&&loc?loc:{id:d.id,...d.data()}});
      first[c]=true; ready()},e=>{first[c]=true;ready();err(e)});
  }
  setTimeout(()=>{if(!state.loaded){state.loaded=true;purgeLegacyAccounts();render();tinvBoot()}},8000);
})();
})();
</script>

</body></html>
